[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "beads-map"
version = "0.2.10"
description = "A local dependency graph and metadata editor for Beads repositories"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Helio Pais" }]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Repository = "https://github.com/heliopais/beads-map"

[project.scripts]
beads-map = "beads_map:main"

[tool.setuptools]
packages = ["beads_map"]
package-dir = { beads_map = "." }
include-package-data = false

[tool.setuptools.package-data]
beads_map = ["web/index.html"]
