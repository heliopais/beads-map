<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beads Map</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: light-dark(#f4f5f7, #101317);
      --surface: light-dark(#ffffff, #191d22);
      --surface-2: light-dark(#eef1f4, #23282f);
      --text: light-dark(#18202a, #edf1f5);
      --muted: light-dark(#687482, #aab4bf);
      --line: light-dark(#cbd3dc, #46505b);
      --focus: light-dark(#285df5, #8eacff);
      --completed: #7b8794;
      --in-progress: #4386d8;
      --ready: #2a9464;
      --blocked: #db8b3c;
      --deferred: #9a6cc7;
      --epic: #8a58c7;
      --search: #c28a12;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button { font: inherit; }
    header {
      min-height: 62px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 11px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }
    .logo {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: var(--surface);
      background: var(--text);
      font-size: 11px;
      font-weight: 700;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand strong { flex: 0 0 auto; font-size: 15px; }
    .repository-controls { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .repository-select {
      width: min(280px, 34vw);
      height: 34px;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 28px 0 9px;
      font: inherit;
    }
    .spacer { flex: 1; }
    .header-button {
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 11px;
      cursor: pointer;
    }
    .header-button:hover { border-color: var(--focus); }
    .header-button:disabled { cursor: default; opacity: .45; }
    .summary {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
      align-items: center;
      padding: 9px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }
    .legend { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
    .freshness { color: var(--ready); }
    .freshness.stale { color: #c65353; font-weight: 650; }
    .legend button {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 7px;
      color: inherit;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 999px;
      cursor: pointer;
    }
    .legend button[aria-pressed="true"] {
      background: color-mix(in srgb, currentColor 10%, transparent);
      border-color: color-mix(in srgb, currentColor 45%, transparent);
    }
    .legend button[aria-pressed="false"] { opacity: .42; }
    .legend button:hover { border-color: currentColor; }
    .legend .show-all { color: var(--muted); }
    .legend .show-all:disabled { cursor: default; opacity: .42; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .completed { color: var(--completed); }
    .in-progress { color: var(--in-progress); }
    .ready { color: var(--ready); }
    .blocked { color: var(--blocked); }
    .deferred { color: var(--deferred); }

    main {
      height: calc(100vh - 103px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
    }
    .graph-panel { min-width: 0; padding: 14px; overflow: hidden; }
    .graph-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px 14px;
      margin: 0 2px 9px;
      color: var(--muted);
      font-size: 12px;
    }
    .graph-head strong { color: var(--text); }
    .graph-tools, .zoom-controls, .search-controls { display: flex; align-items: center; gap: 6px; }
    .search-controls { margin-left: auto; }
    .search-input {
      width: min(220px, 24vw);
      height: 28px;
      padding: 0 8px;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 6px;
      font: inherit;
    }
    .search-input:focus { border-color: var(--focus); outline: 2px solid color-mix(in srgb, var(--focus) 25%, transparent); }
    .search-count { min-width: 68px; text-align: center; font-variant-numeric: tabular-nums; }
    .zoom-controls { margin-left: 8px; }
    .zoom-controls button, .search-controls button {
      min-width: 30px;
      height: 28px;
      padding: 0 8px;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 6px;
      cursor: pointer;
    }
    .zoom-controls button:hover, .search-controls button:hover { border-color: var(--focus); }
    .zoom-controls button:disabled, .search-controls button:disabled { cursor: default; opacity: .45; }
    .zoom-level { min-width: 40px; text-align: center; font-variant-numeric: tabular-nums; }
    .scroller {
      height: calc(100% - 28px);
      overflow: auto;
      cursor: grab;
      user-select: none;
      border: 1px solid var(--line);
      border-radius: 11px;
      background-color: var(--surface);
      background-image:
        linear-gradient(to right, color-mix(in srgb, var(--line) 25%, transparent) 1px, transparent 1px),
        linear-gradient(to bottom, color-mix(in srgb, var(--line) 25%, transparent) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .scroller.dragging { cursor: grabbing; }
    .scroller.zooming { cursor: ns-resize; }
    .scroller.dragging .node,
    .scroller.zooming .node { cursor: inherit; }
    svg { display: block; }
    .edge { fill: none; stroke-width: 1.7; }
    .edge.blocking { stroke: var(--line); }
    .edge.follow-on { stroke: var(--epic); stroke-dasharray: 8 6; opacity: .78; }
    .edge.hierarchy { stroke: var(--muted); stroke-dasharray: 2 6; opacity: .58; }
    .node { cursor: pointer; outline: none; }
    .node rect {
      fill: var(--surface);
      stroke: var(--line);
      stroke-width: 1.2;
      filter: drop-shadow(0 5px 7px rgba(0,0,0,.12));
    }
    .node .accent { stroke-width: 5; }
    .node.completed .accent { stroke: var(--completed); }
    .node.in-progress .accent { stroke: var(--in-progress); }
    .node.ready .accent { stroke: var(--ready); }
    .node.blocked .accent { stroke: var(--blocked); }
    .node.deferred .accent { stroke: var(--deferred); }
    .node.epic rect:first-child { stroke: var(--epic); stroke-width: 2; }
    .node.completed { opacity: .64; }
    .node:hover rect:first-child,
    .node:focus rect:first-child,
    .node.selected rect:first-child { stroke: var(--focus); stroke-width: 2.5; }
    .node.search-match rect:first-child { stroke: var(--search); stroke-width: 2.3; }
    .node.search-current rect:first-child { stroke: var(--focus); stroke-width: 3.2; }
    .node-title { fill: var(--text); font-size: 13px; font-weight: 600; }
    .node-meta { fill: var(--muted); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }

    aside {
      padding: 18px;
      overflow: auto;
      background: var(--surface);
      border-left: 1px solid var(--line);
    }
    .eyebrow { color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    aside h2 { margin: 8px 0 10px; font-size: 20px; line-height: 1.25; }
    .state {
      display: inline-block;
      margin-bottom: 18px;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--surface-2);
      font-size: 12px;
      font-weight: 650;
    }
    dl { margin: 0; display: grid; gap: 10px; }
    dl div { padding-bottom: 9px; border-bottom: 1px solid var(--line); }
    dt { color: var(--muted); font-size: 11px; }
    dd { margin: 2px 0 0; overflow-wrap: anywhere; }
    .description { margin-top: 16px; white-space: pre-wrap; color: var(--muted); font-size: 12px; }
    .readonly { margin-top: 18px; padding: 10px; border-radius: 8px; background: var(--surface-2); color: var(--muted); font-size: 11px; }
    .empty { color: var(--muted); }
    .error { display: none; margin: 20px; padding: 14px; border: 1px solid #c65353; border-radius: 8px; color: #c65353; background: var(--surface); white-space: pre-wrap; }

    @media (max-width: 760px) {
      header { flex-wrap: wrap; }
      .brand { width: calc(100% - 44px); }
      .repository-select { width: min(100%, 240px); }
      main { height: auto; grid-template-columns: 1fr; }
      .graph-panel { height: 65vh; }
      aside { border-left: 0; border-top: 1px solid var(--line); }
      .legend { width: 100%; margin-left: 0; }
      .graph-tools { width: 100%; flex-wrap: wrap; }
      .search-controls { width: 100%; margin-left: 0; }
      .search-input { flex: 1; width: auto; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo" aria-hidden="true">BM</div>
    <div class="brand">
      <strong>Beads Map</strong>
      <div class="repository-controls">
        <select class="repository-select" id="repository-select" aria-label="Repository">
          <option>Loading repositories…</option>
        </select>
        <button class="header-button" id="repository-add" type="button">Add…</button>
        <button class="header-button" id="repository-remove" type="button">Remove</button>
      </div>
    </div>
    <div class="spacer"></div>
    <button class="header-button" id="refresh" type="button">Refresh</button>
  </header>

  <section class="summary" aria-label="Graph summary">
    <strong id="counts">Loading graph…</strong>
    <span class="freshness" id="freshness" aria-live="polite"></span>
    <div class="legend" aria-label="Status filters">
      <button class="completed" type="button" data-state="completed" aria-pressed="true"><i class="dot"></i>Completed</button>
      <button class="in-progress" type="button" data-state="in-progress" aria-pressed="true"><i class="dot"></i>In progress</button>
      <button class="ready" type="button" data-state="ready" aria-pressed="true"><i class="dot"></i>Ready</button>
      <button class="blocked" type="button" data-state="blocked" aria-pressed="true"><i class="dot"></i>Blocked</button>
      <button class="deferred" type="button" data-state="deferred" aria-pressed="true"><i class="dot"></i>Deferred</button>
      <button class="show-all" id="status-show-all" type="button" disabled>Show all</button>
    </div>
  </section>

  <div class="error" id="error" role="alert"></div>
  <main id="workspace">
    <section class="graph-panel" aria-label="Dependency graph">
      <div class="graph-head">
        <strong>Dependency graph</strong>
        <div class="graph-tools">
          <span>Left → right · Solid prerequisite · Dashed follow-on · Dotted hierarchy</span>
          <div class="search-controls" role="search" aria-label="Find work items">
            <input class="search-input" id="graph-search" type="search" placeholder="Search title or ID" autocomplete="off" aria-label="Search work items by title or ID">
            <span class="search-count" id="search-count" aria-live="polite"></span>
            <button id="search-previous" type="button" aria-label="Previous search match" title="Previous match (Shift+Enter)" disabled>↑</button>
            <button id="search-next" type="button" aria-label="Next search match" title="Next match (Enter)" disabled>↓</button>
          </div>
          <div class="zoom-controls" aria-label="Graph zoom controls">
            <button id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out">−</button>
            <span class="zoom-level" id="zoom-level" aria-live="polite">100%</span>
            <button id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in">+</button>
            <button id="zoom-fit" type="button">Fit</button>
          </div>
        </div>
      </div>
      <div class="scroller" id="graph-scroller"><svg id="graph" role="img" aria-label="Beads dependency graph"></svg></div>
    </section>
    <aside aria-live="polite">
      <div id="details-empty" class="empty">Select a work item to see its details.</div>
      <div id="details" hidden>
        <div class="eyebrow"><span id="detail-type"></span> · <span id="detail-id"></span></div>
        <h2 id="detail-title"></h2>
        <div class="state" id="detail-state"></div>
        <dl>
          <div><dt>Raw status</dt><dd id="detail-raw"></dd></div>
          <div><dt>Blocked by</dt><dd id="detail-blockers"></dd></div>
          <div><dt>Blocks</dt><dd id="detail-dependents"></dd></div>
          <div><dt>Labels</dt><dd id="detail-labels"></dd></div>
          <div><dt>Assignee</dt><dd id="detail-assignee"></dd></div>
        </dl>
        <div class="description" id="detail-description"></div>
      </div>
      <div class="readonly">Read-only POC · Changes made with Beads appear automatically.</div>
    </aside>
  </main>

  <script>
    const SVG = 'http://www.w3.org/2000/svg';
    const NODE_W = 240;
    const NODE_H = 82;
    const X_GAP = 180;
    const Y_GAP = 52;
    const MIN_ZOOM = 0.35;
    const MAX_ZOOM = 2;
    const ALL_STATES = ['completed', 'in-progress', 'ready', 'blocked', 'deferred'];
    const visibleStates = new Set(ALL_STATES);
    let graphData = null;
    let selectedId = null;
    let currentRepository = null;
    let graphSize = { width: 760, height: 520 };
    let zoom = 1;
    let snapshotHash = null;
    let refreshing = false;
    let catalogViews = {};
    let viewSaveTimer = null;
    let nodePositions = new Map();
    let searchMatches = [];
    let searchIndex = -1;

    const el = id => document.getElementById(id);
    const svgElement = (name, attributes = {}) => {
      const node = document.createElementNS(SVG, name);
      Object.entries(attributes).forEach(([key, value]) => node.setAttribute(key, value));
      return node;
    };

    async function requestJSON(url, options = {}) {
      const response = await fetch(url, { cache: 'no-store', ...options });
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.error || 'Request failed');
      return payload;
    }

    function renderCatalog(catalog) {
      catalogViews = catalog.views || {};
      const select = el('repository-select');
      select.replaceChildren();
      if (!catalog.repositories.length) {
        const option = document.createElement('option');
        option.textContent = 'No repositories yet';
        option.value = '';
        select.append(option);
      } else {
        catalog.repositories.forEach(repository => {
          const option = document.createElement('option');
          option.value = repository.path;
          option.textContent = repository.name;
          option.title = repository.path;
          select.append(option);
        });
        select.value = catalog.selected || catalog.repositories[0].path;
      }
      select.title = select.value;
      el('repository-remove').disabled = !select.value;
    }

    function setBusy(busy) {
      const select = el('repository-select');
      select.disabled = busy || !select.value;
      el('repository-add').disabled = busy;
      el('repository-remove').disabled = busy || !select.value;
      el('refresh').disabled = busy || !select.value;
    }

    function showError(error, keepGraph = false) {
      if (!keepGraph) el('workspace').hidden = true;
      el('error').textContent = error.message;
      el('error').style.display = 'block';
    }

    function updateFreshness(freshness = {}) {
      const indicator = el('freshness');
      indicator.classList.toggle('stale', Boolean(freshness.stale));
      indicator.textContent = freshness.stale ? 'Showing last good snapshot' : 'Up to date';
      indicator.title = freshness.error || (freshness.updatedAt
        ? `Last read ${new Date(freshness.updatedAt).toLocaleTimeString()}`
        : '');
    }

    function applyGraph(payload) {
      snapshotHash = payload.snapshotHash || snapshotHash;
      updateFreshness(payload.freshness);
      if (!payload.unchanged) renderGraph(payload);
    }

    function currentView() {
      const scroller = el('graph-scroller');
      return {
        zoom,
        scrollLeft: scroller.scrollLeft,
        scrollTop: scroller.scrollTop,
        selectedId,
        visibleStates: [...visibleStates],
      };
    }

    async function persistView() {
      window.clearTimeout(viewSaveTimer);
      viewSaveTimer = null;
      if (!currentRepository || location.protocol === 'file:') return;
      const path = currentRepository;
      const view = currentView();
      catalogViews[path] = view;
      try {
        await requestJSON('/api/view', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Beads-Map': '1' },
          body: JSON.stringify({ path, view }),
        });
      } catch (error) {
        showError(error, true);
      }
    }

    function scheduleViewSave() {
      window.clearTimeout(viewSaveTimer);
      viewSaveTimer = window.setTimeout(persistView, 350);
    }

    function renderSearchState() {
      const query = el('graph-search').value.trim();
      const count = el('search-count');
      if (!query) count.textContent = '';
      else if (!searchMatches.length) count.textContent = 'No matches';
      else if (searchIndex >= 0) count.textContent = `${searchIndex + 1} of ${searchMatches.length}`;
      else count.textContent = `${searchMatches.length} ${searchMatches.length === 1 ? 'match' : 'matches'}`;
      el('search-previous').disabled = !searchMatches.length;
      el('search-next').disabled = !searchMatches.length;
      const matchIds = new Set(searchMatches.map(node => node.id));
      const currentId = searchIndex >= 0 ? searchMatches[searchIndex]?.id : null;
      document.querySelectorAll('.node').forEach(node => {
        node.classList.toggle('search-match', matchIds.has(node.dataset.id));
        node.classList.toggle('search-current', node.dataset.id === currentId);
      });
    }

    function updateGraphSearch(preserveCurrent = false) {
      const query = el('graph-search').value.trim().toLocaleLowerCase();
      const currentId = preserveCurrent && searchIndex >= 0 ? searchMatches[searchIndex]?.id : null;
      searchMatches = query && graphData
        ? graphData.nodes.filter(node => `${node.id}\n${node.title}`.toLocaleLowerCase().includes(query))
        : [];
      searchIndex = currentId ? searchMatches.findIndex(node => node.id === currentId) : -1;
      renderSearchState();
    }

    function clearGraphSearch() {
      el('graph-search').value = '';
      searchMatches = [];
      searchIndex = -1;
      renderSearchState();
    }

    function focusNode(id) {
      const position = nodePositions.get(id);
      if (!position) return;
      const scroller = el('graph-scroller');
      scroller.scrollTo({
        left: (position.x + NODE_W / 2) * zoom - scroller.clientWidth / 2,
        top: (position.y + NODE_H / 2) * zoom - scroller.clientHeight / 2,
        behavior: 'smooth',
      });
    }

    function navigateSearch(direction) {
      if (!searchMatches.length) return;
      if (searchIndex < 0) searchIndex = direction > 0 ? 0 : searchMatches.length - 1;
      else searchIndex = (searchIndex + direction + searchMatches.length) % searchMatches.length;
      const node = searchMatches[searchIndex];
      selectNode(node.id);
      focusNode(node.id);
      renderSearchState();
      scheduleViewSave();
    }

    function clearDetails() {
      selectedId = null;
      el('details').hidden = true;
      el('details-empty').hidden = false;
      document.querySelectorAll('.node').forEach(node => node.classList.remove('selected'));
    }

    function updateStatusControls() {
      document.querySelectorAll('[data-state]').forEach(button => {
        button.setAttribute('aria-pressed', String(visibleStates.has(button.dataset.state)));
      });
      el('status-show-all').disabled = visibleStates.size === ALL_STATES.length;
    }

    function toggleStatus(state) {
      if (visibleStates.has(state)) visibleStates.delete(state);
      else visibleStates.add(state);
      updateStatusControls();
      if (graphData) renderGraph(graphData);
      scheduleViewSave();
    }

    function showAllStatuses() {
      ALL_STATES.forEach(state => visibleStates.add(state));
      updateStatusControls();
      if (graphData) renderGraph(graphData);
      scheduleViewSave();
    }

    function rankNodes(nodes, edges) {
      const rank = new Map(nodes.map(node => [node.id, 0]));
      const incoming = new Map(nodes.map(node => [node.id, 0]));
      const outgoing = new Map(nodes.map(node => [node.id, []]));
      edges.forEach(edge => {
        incoming.set(edge.target, (incoming.get(edge.target) || 0) + 1);
        outgoing.get(edge.source)?.push(edge.target);
      });
      const queue = nodes.filter(node => incoming.get(node.id) === 0).map(node => node.id);
      while (queue.length) {
        const source = queue.shift();
        for (const target of outgoing.get(source) || []) {
          rank.set(target, Math.max(rank.get(target) || 0, (rank.get(source) || 0) + 1));
          incoming.set(target, incoming.get(target) - 1);
          if (incoming.get(target) === 0) queue.push(target);
        }
      }
      return rank;
    }

    function orderColumns(nodes, edges, ranks) {
      const columns = new Map();
      nodes
        .slice()
        .sort((a, b) => a.title.localeCompare(b.title))
        .forEach(node => {
          const column = ranks.get(node.id) || 0;
          if (!columns.has(column)) columns.set(column, []);
          columns.get(column).push(node);
        });

      const incoming = new Map(nodes.map(node => [node.id, []]));
      const outgoing = new Map(nodes.map(node => [node.id, []]));
      edges.forEach(edge => {
        incoming.get(edge.target)?.push(edge.source);
        outgoing.get(edge.source)?.push(edge.target);
      });

      const normalizedPositions = () => {
        const positions = new Map();
        for (const columnNodes of columns.values()) {
          const denominator = Math.max(1, columnNodes.length - 1);
          columnNodes.forEach((node, index) => positions.set(node.id, index / denominator));
        }
        return positions;
      };

      const reorder = (column, neighbors) => {
        const columnNodes = columns.get(column);
        if (!columnNodes?.length) return;
        const positions = normalizedPositions();
        const scored = columnNodes.map((node, index) => {
          const values = (neighbors.get(node.id) || [])
            .map(id => positions.get(id))
            .filter(value => value !== undefined)
            .sort((a, b) => a - b);
          if (!values.length) return { node, index, score: null, mean: null };
          const middle = Math.floor(values.length / 2);
          const score = values.length % 2
            ? values[middle]
            : (values[middle - 1] + values[middle]) / 2;
          const mean = values.reduce((sum, value) => sum + value, 0) / values.length;
          return { node, index, score, mean };
        });
        scored.sort((a, b) => {
          if (a.score === null && b.score !== null) return 1;
          if (a.score !== null && b.score === null) return -1;
          if (a.score !== null && b.score !== null) {
            return a.score - b.score || a.mean - b.mean || a.index - b.index;
          }
          return a.index - b.index;
        });
        columns.set(column, scored.map(item => item.node));
      };

      const maxRank = Math.max(0, ...ranks.values());
      for (let pass = 0; pass < 10; pass += 1) {
        for (let column = 1; column <= maxRank; column += 1) reorder(column, incoming);
        for (let column = maxRank - 1; column >= 0; column -= 1) reorder(column, outgoing);
      }
      return columns;
    }

    function routedEdgePath(startX, startY, laneX, endX, endY) {
      if (Math.abs(endY - startY) < 1) return `M${startX} ${startY} H${endX}`;
      const direction = Math.sign(endY - startY);
      const radius = Math.max(0, Math.min(12, Math.abs(endY - startY) / 2, (laneX - startX) / 2));
      return [
        `M${startX} ${startY}`,
        `H${laneX - radius}`,
        `Q${laneX} ${startY} ${laneX} ${startY + direction * radius}`,
        `V${endY - direction * radius}`,
        `Q${laneX} ${endY} ${laneX + radius} ${endY}`,
        `H${endX}`,
      ].join(' ');
    }

    function wrapTitle(title, max = 31) {
      const words = title.split(/\s+/);
      const lines = ['', ''];
      for (const word of words) {
        const index = lines[0].length < max ? 0 : 1;
        const candidate = `${lines[index]} ${word}`.trim();
        if (index === 1 && candidate.length > max) {
          lines[1] = `${lines[1].slice(0, Math.max(0, max - 1)).trim()}…`;
          break;
        }
        lines[index] = candidate;
      }
      return lines.filter(Boolean);
    }

    function setZoom(nextZoom, preservePosition = true, anchor = null) {
      const scroller = el('graph-scroller');
      const anchorPoint = anchor || {
        x: scroller.clientWidth / 2,
        y: scroller.clientHeight / 2,
      };
      const contentPoint = {
        x: (scroller.scrollLeft + anchorPoint.x) / zoom,
        y: (scroller.scrollTop + anchorPoint.y) / zoom,
      };
      zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, nextZoom));
      el('graph').setAttribute('width', Math.round(graphSize.width * zoom));
      el('graph').setAttribute('height', Math.round(graphSize.height * zoom));
      el('zoom-level').textContent = `${Math.round(zoom * 100)}%`;
      el('zoom-out').disabled = zoom <= MIN_ZOOM;
      el('zoom-in').disabled = zoom >= MAX_ZOOM;
      if (preservePosition) {
        scroller.scrollLeft = contentPoint.x * zoom - anchorPoint.x;
        scroller.scrollTop = contentPoint.y * zoom - anchorPoint.y;
      }
    }

    function fitGraph() {
      const scroller = el('graph-scroller');
      const widthScale = Math.max(1, scroller.clientWidth - 24) / graphSize.width;
      const heightScale = Math.max(1, scroller.clientHeight - 24) / graphSize.height;
      setZoom(Math.min(1, widthScale, heightScale), false);
      scroller.scrollTo({ left: 0, top: 0 });
      scheduleViewSave();
    }

    let canvasGesture = null;

    function beginCanvasGesture(event) {
      if (event.button !== 0 || event.target.closest?.('.node')) return;
      const scroller = el('graph-scroller');
      const bounds = scroller.getBoundingClientRect();
      canvasGesture = {
        pointerId: event.pointerId,
        mode: event.metaKey ? 'zoom' : 'pan',
        startX: event.clientX,
        startY: event.clientY,
        startScrollLeft: scroller.scrollLeft,
        startScrollTop: scroller.scrollTop,
        startZoom: zoom,
        anchor: { x: event.clientX - bounds.left, y: event.clientY - bounds.top },
        active: false,
      };
      if (typeof event.pointerId === 'number') scroller.setPointerCapture(event.pointerId);
      event.preventDefault();
    }

    function moveCanvasGesture(event) {
      if (!canvasGesture || event.pointerId !== canvasGesture.pointerId) return;
      const deltaX = event.clientX - canvasGesture.startX;
      const deltaY = event.clientY - canvasGesture.startY;
      if (!canvasGesture.active && Math.hypot(deltaX, deltaY) < 3) return;

      const scroller = el('graph-scroller');
      if (!canvasGesture.active) {
        canvasGesture.active = true;
        scroller.classList.add(canvasGesture.mode === 'zoom' ? 'zooming' : 'dragging');
      }
      if (canvasGesture.mode === 'zoom') {
        const nextZoom = canvasGesture.startZoom * Math.exp(-deltaY / 300);
        setZoom(nextZoom, true, canvasGesture.anchor);
      } else {
        scroller.scrollLeft = canvasGesture.startScrollLeft - deltaX;
        scroller.scrollTop = canvasGesture.startScrollTop - deltaY;
      }
      event.preventDefault();
    }

    function endCanvasGesture(event) {
      if (!canvasGesture || event.pointerId !== canvasGesture.pointerId) return;
      const scroller = el('graph-scroller');
      scroller.classList.remove('dragging', 'zooming');
      if (typeof event.pointerId === 'number' && scroller.hasPointerCapture(event.pointerId)) {
        scroller.releasePointerCapture(event.pointerId);
      }
      canvasGesture = null;
      scheduleViewSave();
    }

    function renderGraph(data) {
      const repositoryChanged = currentRepository !== data.path;
      let savedScroll = null;
      if (repositoryChanged) {
        clearGraphSearch();
        clearDetails();
        const view = catalogViews[data.path] || {};
        zoom = view.zoom || 1;
        selectedId = view.selectedId || null;
        visibleStates.clear();
        const savedStates = Array.isArray(view.visibleStates) ? view.visibleStates : ALL_STATES;
        savedStates.forEach(state => {
          if (ALL_STATES.includes(state)) visibleStates.add(state);
        });
        updateStatusControls();
        savedScroll = { left: view.scrollLeft || 0, top: view.scrollTop || 0 };
      }
      currentRepository = data.path;
      graphData = data;
      const svg = el('graph');
      svg.replaceChildren();
      const visibleNodes = data.nodes.filter(node => visibleStates.has(node.state));
      const visibleIds = new Set(visibleNodes.map(node => node.id));
      const visibleEdges = data.edges.filter(edge => visibleIds.has(edge.source) && visibleIds.has(edge.target));
      const ranks = rankNodes(visibleNodes, visibleEdges);
      const columns = orderColumns(visibleNodes, visibleEdges, ranks);

      const positions = new Map();
      let maxRows = 1;
      for (const [column, nodes] of columns) {
        maxRows = Math.max(maxRows, nodes.length);
        nodes.forEach((node, row) => positions.set(node.id, {
          x: 48 + column * (NODE_W + X_GAP),
          y: 48 + row * (NODE_H + Y_GAP),
        }));
      }
      const maxRank = Math.max(0, ...ranks.values());
      const width = Math.max(760, 96 + (maxRank + 1) * NODE_W + maxRank * X_GAP);
      const height = Math.max(520, 96 + maxRows * NODE_H + (maxRows - 1) * Y_GAP);
      graphSize = { width, height };
      nodePositions = positions;
      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      setZoom(zoom, false);
      if (savedScroll) el('graph-scroller').scrollTo(savedScroll);

      const defs = svgElement('defs');
      const markerColors = {
        blocking: 'var(--line)',
        'follow-on': 'var(--epic)',
        hierarchy: 'var(--muted)',
      };
      Object.entries(markerColors).forEach(([kind, color]) => {
        const marker = svgElement('marker', { id: `arrow-${kind}`, markerWidth: 8, markerHeight: 8, refX: 7, refY: 4, orient: 'auto' });
        marker.append(svgElement('path', { d: 'M0,0 L8,4 L0,8 Z', fill: color }));
        defs.append(marker);
      });
      svg.append(defs);

      const edgesByTargetColumn = new Map();
      visibleEdges.forEach(edge => {
        const column = ranks.get(edge.target) || 0;
        if (!edgesByTargetColumn.has(column)) edgesByTargetColumn.set(column, []);
        edgesByTargetColumn.get(column).push(edge);
      });
      const laneByEdge = new Map();
      for (const edges of edgesByTargetColumn.values()) {
        edges.sort((a, b) => {
          const targetDifference = positions.get(a.target).y - positions.get(b.target).y;
          return targetDifference || positions.get(a.source).y - positions.get(b.source).y;
        });
        edges.forEach((edge, index) => {
          const target = positions.get(edge.target);
          const gutterLeft = target.x - X_GAP;
          const gutterPadding = 22;
          const usableWidth = X_GAP - gutterPadding * 2;
          laneByEdge.set(edge, Math.round(
            gutterLeft + gutterPadding + usableWidth * (index + 1) / (edges.length + 1),
          ));
        });
      }

      visibleEdges.forEach(edge => {
        const source = positions.get(edge.source);
        const target = positions.get(edge.target);
        if (!source || !target) return;
        const startX = source.x + NODE_W;
        const startY = source.y + NODE_H / 2;
        const endX = target.x;
        const endY = target.y + NODE_H / 2;
        svg.append(svgElement('path', {
          class: `edge ${edge.kind}`,
          d: routedEdgePath(startX, startY, laneByEdge.get(edge), endX, endY),
          'marker-end': `url(#arrow-${edge.kind})`,
        }));
      });

      visibleNodes.forEach(node => {
        const position = positions.get(node.id);
        const group = svgElement('g', {
          class: `node ${node.state} ${node.type === 'epic' ? 'epic' : ''}`,
          transform: `translate(${position.x} ${position.y})`,
          tabindex: '0',
          role: 'button',
          'aria-label': `${node.title}, ${node.state}`,
        });
        group.dataset.id = node.id;
        group.append(svgElement('rect', { width: NODE_W, height: NODE_H, rx: 9 }));
        group.append(svgElement('line', { class: 'accent', x1: 3, y1: 10, x2: 3, y2: NODE_H - 10 }));

        const meta = svgElement('text', { class: 'node-meta', x: 15, y: 20 });
        meta.textContent = `${node.type} · ${node.state.replace('-', ' ')}`;
        group.append(meta);

        const title = svgElement('text', { class: 'node-title', x: 15, y: 43 });
        wrapTitle(node.title).forEach((line, index) => {
          const tspan = svgElement('tspan', { x: 15, dy: index === 0 ? 0 : 17 });
          tspan.textContent = line;
          title.append(tspan);
        });
        group.append(title);
        const activate = () => {
          selectNode(node.id);
          scheduleViewSave();
        };
        group.addEventListener('click', activate);
        group.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            activate();
          }
        });
        svg.append(group);
      });

      el('repository-select').value = data.path;
      el('repository-select').title = data.path;
      const issueCount = visibleNodes.length === data.nodes.length
        ? `${data.nodes.length} issues`
        : `${visibleNodes.length} of ${data.nodes.length} issues`;
      el('counts').textContent = `${issueCount} · ${visibleEdges.length} relationships`;
      if (selectedId && visibleIds.has(selectedId)) selectNode(selectedId);
      else if (selectedId) clearDetails();
      updateGraphSearch(true);
    }

    function namesFor(ids) {
      const byId = new Map(graphData.nodes.map(node => [node.id, node.title]));
      return ids.length ? ids.map(id => byId.get(id) || id).join(', ') : 'None';
    }

    function selectNode(id) {
      const node = graphData.nodes.find(candidate => candidate.id === id);
      if (!node) return;
      selectedId = id;
      document.querySelectorAll('.node').forEach(element => element.classList.toggle('selected', element.dataset.id === id));
      el('details-empty').hidden = true;
      el('details').hidden = false;
      el('detail-type').textContent = node.type;
      el('detail-id').textContent = node.id;
      el('detail-title').textContent = node.title;
      el('detail-state').textContent = node.state.replace('-', ' ');
      el('detail-state').className = `state ${node.state}`;
      el('detail-raw').textContent = node.rawStatus;
      el('detail-blockers').textContent = namesFor(node.blockers);
      el('detail-dependents').textContent = namesFor(node.dependents);
      el('detail-labels').textContent = node.labels.length ? node.labels.join(', ') : 'None';
      el('detail-assignee').textContent = node.assignee || 'Unassigned';
      el('detail-description').textContent = node.description;
    }

    async function loadGraph({ background = false } = {}) {
      if (refreshing) return;
      refreshing = true;
      if (!background) setBusy(true);
      if (location.protocol === 'file:') {
        const appRoot = decodeURIComponent(location.pathname).replace(/\/web\/index\.html$/, '');
        const shellPath = appRoot.replaceAll('"', '\\"');
        el('repository-select').replaceChildren(new Option('Server not running', ''));
        el('counts').textContent = 'Start Beads Map to load the graph';
        el('workspace').hidden = true;
        el('error').textContent = `This page needs the local Beads Map server.\n\nRun this in Terminal:\ncd "${shellPath}"\npython3 beads_map.py .\n\nThen open http://127.0.0.1:8765`;
        el('error').style.display = 'block';
        refreshing = false;
        return;
      }
      try {
        const query = snapshotHash ? `?hash=${encodeURIComponent(snapshotHash)}` : '';
        const payload = await requestJSON(`/api/graph${query}`);
        el('error').style.display = 'none';
        el('workspace').hidden = false;
        applyGraph(payload);
      } catch (error) {
        showError(error, Boolean(graphData));
      } finally {
        refreshing = false;
        if (!background) setBusy(false);
      }
    }

    async function chooseRepository(path) {
      if (!path || path === currentRepository) return;
      await persistView();
      setBusy(true);
      el('error').style.display = 'none';
      try {
        const payload = await requestJSON('/api/repositories/select', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Beads-Map': '1' },
          body: JSON.stringify({ path }),
        });
        renderCatalog(payload.catalog);
        el('workspace').hidden = false;
        applyGraph(payload.graph);
      } catch (error) {
        el('repository-select').value = currentRepository || '';
        showError(error, Boolean(graphData));
      } finally {
        setBusy(false);
      }
    }

    async function addRepository() {
      setBusy(true);
      el('error').style.display = 'none';
      try {
        const payload = await requestJSON('/api/repositories/pick', {
          method: 'POST',
          headers: { 'X-Beads-Map': '1' },
        });
        if (payload.cancelled) return;
        renderCatalog(payload.catalog);
        el('workspace').hidden = false;
        applyGraph(payload.graph);
      } catch (error) {
        showError(error, Boolean(graphData));
      } finally {
        setBusy(false);
      }
    }

    async function removeRepository() {
      const select = el('repository-select');
      const path = select.value;
      if (!path) return;
      const name = select.options[select.selectedIndex]?.textContent || path;
      if (!window.confirm(`Remove ${name} from Beads Map?`)) return;
      setBusy(true);
      el('error').style.display = 'none';
      try {
        const catalog = await requestJSON('/api/repositories', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json', 'X-Beads-Map': '1' },
          body: JSON.stringify({ path }),
        });
        renderCatalog(catalog);
        currentRepository = null;
        graphData = null;
        snapshotHash = null;
        clearDetails();
        if (catalog.selected) await loadGraph();
        else {
          el('graph').replaceChildren();
          el('workspace').hidden = true;
          el('counts').textContent = 'Add a repository to load a graph';
        }
      } catch (error) {
        showError(error, Boolean(graphData));
      } finally {
        setBusy(false);
      }
    }

    async function initialize() {
      if (location.protocol === 'file:') {
        await loadGraph();
        return;
      }
      try {
        renderCatalog(await requestJSON('/api/repositories'));
        await loadGraph();
      } catch (error) {
        showError(error);
        setBusy(false);
      }
    }

    el('refresh').addEventListener('click', loadGraph);
    el('repository-select').addEventListener('change', event => chooseRepository(event.target.value));
    el('repository-add').addEventListener('click', addRepository);
    el('repository-remove').addEventListener('click', removeRepository);
    el('graph-search').addEventListener('input', () => updateGraphSearch(false));
    el('graph-search').addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        event.preventDefault();
        navigateSearch(event.shiftKey ? -1 : 1);
      } else if (event.key === 'Escape') {
        clearGraphSearch();
      }
    });
    el('search-previous').addEventListener('click', () => navigateSearch(-1));
    el('search-next').addEventListener('click', () => navigateSearch(1));
    document.addEventListener('keydown', event => {
      if ((event.metaKey || event.ctrlKey) && event.key.toLocaleLowerCase() === 'f') {
        event.preventDefault();
        el('graph-search').focus();
        el('graph-search').select();
      }
    });
    document.querySelectorAll('[data-state]').forEach(button => {
      button.addEventListener('click', () => toggleStatus(button.dataset.state));
    });
    el('status-show-all').addEventListener('click', showAllStatuses);
    el('zoom-out').addEventListener('click', () => {
      setZoom(zoom - 0.15);
      scheduleViewSave();
    });
    el('zoom-in').addEventListener('click', () => {
      setZoom(zoom + 0.15);
      scheduleViewSave();
    });
    el('zoom-fit').addEventListener('click', fitGraph);
    el('graph-scroller').addEventListener('pointerdown', beginCanvasGesture);
    el('graph-scroller').addEventListener('pointermove', moveCanvasGesture);
    el('graph-scroller').addEventListener('pointerup', endCanvasGesture);
    el('graph-scroller').addEventListener('pointercancel', endCanvasGesture);
    el('graph-scroller').addEventListener('dragstart', event => event.preventDefault());
    el('graph-scroller').addEventListener('scroll', scheduleViewSave);
    initialize();
    window.setInterval(() => {
      if (!document.hidden && currentRepository && !el('repository-select').disabled) {
        loadGraph({ background: true });
      }
    }, 5000);
  </script>
</body>
</html>
